sync.settings:
  type: config_object
  label: Sync Settings
  mapping:
    log_verbose:
      type: boolean
      label: Log Verbose
    email_fail:
      type: string
      label: Email on Fail
    email_fetch_fail:
      type: string
      label: Email on Fetch Fail
    lock_enabled:
      type: boolean
      label: Allow locking synced entities
    cron_queue:
      type: boolean
      label: Process sync queues during core cron
    cron_build:
      type: boolean
      label: Build due sync runs during core cron
    cron_queue_time:
      type: integer
      label: Seconds per sync queue during core cron

field.widget.settings.sync_readonly:
  type: mapping
  label: 'Readonly Field Widget display format settings'
  mapping:
    label:
      type: string
      label: 'Label'
    formatter_type:
      type: string
      label: 'Format'
    formatter_settings:
      type: sequence
      label: 'Formatter Settings'
      sequence:
        type: field.formatter.settings.[%key]
    show_description:
      type: boolean
      label: 'Show Description'
    error_validation:
      type: boolean
      label: 'Error Validation'
    empty_value:
      type: string
      label: 'Empty value'
